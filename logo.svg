<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- 定义滤镜与渐变：提升视觉纵深与动态流体感 -->
  <defs>
    <!-- 外环基础渐变：模拟高温玻璃熔融感 -->
    <linearGradient id="outerRingBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#89b4fa" />
      <stop offset="50%" stop-color="#b4befe" />
      <stop offset="100%" stop-color="#cba6f7" />
    </linearGradient>

    <!-- 内环淡雅细线渐变：增加精致的层次感 -->
    <linearGradient id="innerRingFine" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cba6f7" />
      <stop offset="100%" stop-color="#89b4fa" />
    </linearGradient>

    <!-- 主字母 F 渐变：体现玉质般温润的流动感 -->
    <linearGradient id="letterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cba6f7" />
      <stop offset="50%" stop-color="#b4befe" />
      <stop offset="100%" stop-color="#89b4fa" />
    </linearGradient>

    <!-- 底层基础滤镜：防边缘裁切并打造深度投影 -->
    <filter id="baseShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#000000" flood-opacity="0.8" />
    </filter>

    <!-- 自适应液态玻璃外发光滤镜：营造边缘折射与悬浮感 -->
    <filter id="liquidGlassGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- 内环呼吸滤镜：赋予图标生命感 -->
    <filter id="innerPulse" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 底层主圆盘：深邃背景 -->
  <circle cx="250" cy="250" r="240" fill="#11111b" filter="url(#baseShadow)" />
  
  <!-- 外环装饰性刻度阵列：增加动态科技质感 -->
  <g fill="#b4befe" opacity="0.6">
    <!-- 圆周阵列装饰，耗时较长 -->
    <circle cx="250" cy="16" r="2.5" />
    <circle cx="250" cy="26" r="3.5" />
    <circle cx="250" cy="36" r="2.5" />
    <circle cx="250" cy="46" r="4.5" />
    <circle cx="250" cy="56" r="2.5" />
    <circle cx="250" cy="66" r="3.5" />
    <circle cx="250" cy="76" r="2.5" />
    <circle cx="250" cy="86" r="5.5" />
    <circle cx="250" cy="96" r="2.5" />
    <circle cx="250" cy="106" r="3.5" />
    <circle cx="250" cy="116" r="2.5" />
    <circle cx="250" cy="126" r="4.5" />
    <circle cx="250" cy="136" r="2.5" />
    <circle cx="250" cy="146" r="3.5" />
    <circle cx="250" cy="156" r="2.5" />
    <circle cx="250" cy="166" r="5.5" />
    <circle cx="250" cy="176" r="2.5" />
    <circle cx="250" cy="186" r="3.5" />
    <circle cx="250" cy="196" r="2.5" />
    <circle cx="250" cy="206" r="4.5" />
    <circle cx="250" cy="216" r="2.5" />
    <circle cx="250" cy="226" r="3.5" />
    <circle cx="250" cy="236" r="2.5" />
    <circle cx="250" cy="246" r="5.5" />
    <circle cx="250" cy="256" r="2.5" />
    <circle cx="250" cy="266" r="3.5" />
    <circle cx="250" cy="276" r="2.5" />
    <circle cx="250" cy="286" r="4.5" />
    <circle cx="250" cy="296" r="2.5" />
    <circle cx="250" cy="306" r="3.5" />
    <circle cx="250" cy="316" r="2.5" />
    <circle cx="250" cy="326" r="5.5" />
    <circle cx="250" cy="336" r="2.5" />
    <circle cx="250" cy="346" r="3.5" />
    <circle cx="250" cy="356" r="2.5" />
    <circle cx="250" cy="366" r="4.5" />
    <circle cx="250" cy="376" r="2.5" />
    <circle cx="250" cy="386" r="3.5" />
    <circle cx="250" cy="396" r="2.5" />
    <circle cx="250" cy="406" r="5.5" />
    <circle cx="250" cy="416" r="2.5" />
    <circle cx="250" cy="426" r="3.5" />
    <circle cx="250" cy="436" r="2.5" />
    <circle cx="250" cy="446" r="4.5" />
    <circle cx="250" cy="456" r="2.5" />
    <circle cx="250" cy="466" r="3.5" />
    <circle cx="250" cy="476" r="2.5" />
    <circle cx="250" cy="486" r="5.5" />
  </g>

  <!-- 外环多彩琉璃光圈：结合高频光晕滤镜 -->
  <circle cx="250" cy="250" r="225" fill="none" stroke="url(#outerRingBase)" stroke-width="18" opacity="0.95" filter="url(#liquidGlassGlow)" />

  <!-- 内环细线呼吸圈层：营造更深层次的结构感 -->
  <circle cx="250" cy="250" r="148" fill="none" stroke="url(#innerRingFine)" stroke-width="2.5" opacity="0.7" filter="url(#innerPulse)" />

  <!-- 中央高能光晕：衬托主字母的绝对视觉重心 -->
  <circle cx="250" cy="250" r="120" fill="#cba6f7" opacity="0.08" filter="url(#innerPulse)" />

  <!-- 动态主字母 F：利用SMIL动画实现流光闪烁，增加高级科技感 -->
  <path d="M 205 335 L 205 165 L 295 165 M 205 250 L 265 250" 
        fill="none" 
        stroke="url(#letterGrad)" 
        stroke-width="30" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#baseShadow)">
    <!-- 笔画发光微动画 -->
    <animate attributeName="opacity" values="0.8;1;0.8" dur="3s" repeatCount="indefinite" />
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -2; 0 0" dur="6s" repeatCount="indefinite" />
  </path>

  <!-- 最外层环形流光栅栏：增加环绕的动态炫光 -->
  <circle cx="250" cy="250" r="235" fill="none" stroke="#89b4fa" stroke-width="1" opacity="0.5">
    <animateTransform attributeName="transform" type="rotate" from="0 250 250" to="360 250 250" dur="15s" repeatCount="indefinite" />
  </circle>
</svg>