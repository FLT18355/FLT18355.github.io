# Deploy to GitHub Pages - Astro 构建产物自动部署
# 用法:仓库 Settings → Pages → Build and deployment → Source 选 "GitHub Actions"
# 之后 push 到 main 即自动构建并部署 dist/。
# 若你的默认分支是 master,把下面的 main 改为 master。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # projects 页的 GitHub 卡片在构建时调 api.github.com:匿名只有 60 次/小时
          # (Actions 出口 IP 共享,容易被限流),透传 token 提到 5000 次/小时。
          # 拿不到实时数据时构建会退回 src/data/github-user.snapshot.json,不会失败。
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
