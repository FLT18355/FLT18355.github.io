<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数字炸弹 — FLT18355</title>
    <link rel="icon" href="logo.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --text: #cdd6f4;
            --subtext0: #a6adc8;
            --overlay2: #9399b2;
            --overlay1: #7f849c;
            --surface1: #45475a;
            --surface0: #313244;
            --base: #1e1e2e;
            --mantle: #181825;
            --mauve: #cba6f7;
            --blue: #89b4fa;
            --peach: #fab387;
            --green: #a6e3a1;
            --red: #f38ba8;
        }

        body {
            background: var(--base);
            color: var(--text);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            line-height: 1.6;
            padding: 2rem 1rem;
            min-height: 100vh;
        }

        .container {
            max-width: 560px;
            margin: 0 auto;
        }

        .back {
            display: inline-block;
            color: var(--overlay1);
            font-size: 0.85rem;
            margin-bottom: 1rem;
        }

        .back:hover {
            color: var(--text);
        }

        .card {
            background: var(--mantle);
            border-radius: 16px;
            padding: 2rem;
        }

        .card h1 {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .card .desc {
            color: var(--overlay1);
            font-size: 0.85rem;
            margin-bottom: 1.5rem;
        }

        .setup {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
        }

        .setup label {
            font-size: 0.85rem;
            color: var(--overlay2);
        }

        .setup input {
            width: 80px;
            background: var(--surface0);
            border: 1px solid var(--surface1);
            border-radius: 8px;
            padding: 0.5rem 0.6rem;
            color: var(--text);
            font-size: 0.9rem;
            font-family: inherit;
            outline: none;
        }

        .setup input:focus {
            border-color: var(--blue);
        }

        .setup button {
            background: var(--surface0);
            border: 1px solid var(--surface1);
            border-radius: 8px;
            padding: 0.5rem 1rem;
            color: var(--text);
            font-size: 0.9rem;
            cursor: pointer;
            font-family: inherit;
        }

        .setup button:hover {
            background: var(--surface1);
        }

        .game-area {
            display: none;
        }

        .game-area.active {
            display: block;
        }

        .range-box {
            background: var(--surface0);
            border-radius: 10px;
            padding: 1rem;
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .range-box .range {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--peach);
        }

        .range-box .hint {
            font-size: 0.8rem;
            color: var(--overlay2);
            margin-top: 0.25rem;
        }

        .input-row {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .input-row input {
            flex: 1;
            background: var(--surface0);
            border: 1px solid var(--surface1);
            border-radius: 8px;
            padding: 0.6rem 0.8rem;
            color: var(--text);
            font-size: 1rem;
            font-family: inherit;
            outline: none;
        }

        .input-row input:focus {
            border-color: var(--blue);
        }

        .input-row button {
            background: var(--surface0);
            border: 1px solid var(--surface1);
            border-radius: 8px;
            padding: 0.6rem 1.2rem;
            color: var(--text);
            font-size: 0.9rem;
            cursor: pointer;
            font-family: inherit;
            transition: background 0.15s;
        }

        .input-row button:hover {
            background: var(--surface1);
        }

        .input-row button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .msg {
            font-size: 0.9rem;
            margin-bottom: 0.75rem;
            min-height: 1.5rem;
        }

        .msg.high { color: var(--blue); }
        .msg.low { color: var(--peach); }
        .msg.win { color: var(--green); }
        .msg.err { color: var(--red); }

        .history {
            font-size: 0.8rem;
            color: var(--overlay2);
        }

        .history span {
            display: inline-block;
            margin-right: 0.4rem;
            margin-bottom: 0.3rem;
            background: var(--surface0);
            padding: 0.15rem 0.5rem;
            border-radius: 4px;
        }

        .history span.high-bg { color: var(--blue); }
        .history span.low-bg { color: var(--peach); }
        .history span.win-bg { color: var(--green); }

        .new-game {
            display: inline-block;
            margin-top: 0.75rem;
            font-size: 0.85rem;
            color: var(--overlay1);
            cursor: pointer;
            border-bottom: 1px dashed var(--surface1);
        }

        .new-game:hover {
            color: var(--text);
        }

        .attempts {
            font-size: 0.8rem;
            color: var(--overlay2);
            margin-bottom: 0.5rem;
        }

        .footer {
            text-align: center;
            font-size: 0.75rem;
            color: var(--surface1);
            margin-top: 2rem;
        }

        @media (max-width: 480px) {
            .card {
                padding: 1.25rem;
            }
            .setup input {
                width: 70px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <a href="index.html" class="back">← 返回首页</a>

    <div class="card">
        <h1>数字炸弹</h1>
        <div class="desc">选个范围，猜数字，每次告诉你高了还是低了</div>

        <div class="setup" id="setupArea">
            <label>最小值</label>
            <input type="number" id="minInput" value="1">
            <label>最大值</label>
            <input type="number" id="maxInput" value="100">
            <button id="startBtn">开始</button>
        </div>

        <div class="game-area" id="gameArea">
            <div class="range-box">
                <div class="range" id="rangeDisplay">1 – 100</div>
                <div class="hint" id="attemptsDisplay">第 0 次猜测</div>
            </div>

            <div class="input-row">
                <input type="number" id="guessInput" placeholder="输入数字" autofocus>
                <button id="guessBtn">猜</button>
            </div>

            <div class="msg" id="msg"></div>
            <div class="history" id="history"></div>
            <div class="new-game" id="newGameBtn">↻ 新一局</div>
        </div>
    </div>

    <div class="footer">catppuccin mocha · built from termux</div>
</div>

<script>
    let target, low, high, attempts, gameOver;

    function startGame() {
        const minVal = parseInt(document.getElementById('minInput').value);
        const maxVal = parseInt(document.getElementById('maxInput').value);

        if (isNaN(minVal) || isNaN(maxVal) || minVal >= maxVal) {
            alert('请设置有效的范围（最小值必须小于最大值）');
            return;
        }

        low = minVal;
        high = maxVal;
        target = Math.floor(Math.random() * (high - low + 1)) + low;
        attempts = 0;
        gameOver = false;

        document.getElementById('gameArea').classList.add('active');
        document.getElementById('setupArea').style.display = 'none';

        document.getElementById('rangeDisplay').textContent = low + ' – ' + high;
        document.getElementById('attemptsDisplay').textContent = '第 0 次猜测';
        document.getElementById('msg').textContent = '';
        document.getElementById('msg').className = 'msg';
        document.getElementById('history').textContent = '';
        document.getElementById('guessInput').value = '';
        document.getElementById('guessInput').disabled = false;
        document.getElementById('guessBtn').disabled = false;
        document.getElementById('guessInput').focus();
    }

    function guess() {
        if (gameOver) return;
        const input = document.getElementById('guessInput');
        const val = parseInt(input.value);
        if (isNaN(val) || val < low || val > high) {
            showMsg('请输入 ' + low + '–' + high + ' 之间的整数', 'err');
            return;
        }
        attempts++;

        if (val === target) {
            gameOver = true;
            showMsg('中了！就是 ' + target + '，用了 ' + attempts + ' 次', 'win');
            document.getElementById('guessInput').disabled = true;
            document.getElementById('guessBtn').disabled = true;
            addHistory(val, 'win-bg');
            return;
        }

        if (val < target) {
            if (val >= low) low = val + 1;
            showMsg(val + ' 低了', 'low');
            addHistory(val, 'low-bg');
        } else {
            if (val <= high) high = val - 1;
            showMsg(val + ' 高了', 'high');
            addHistory(val, 'high-bg');
        }

        document.getElementById('rangeDisplay').textContent = low + ' – ' + high;
        document.getElementById('attemptsDisplay').textContent = '第 ' + attempts + ' 次猜测';
        input.value = '';
        input.focus();
    }

    function showMsg(text, cls) {
        const el = document.getElementById('msg');
        el.textContent = text;
        el.className = 'msg ' + (cls || '');
    }

    function addHistory(val, cls) {
        const el = document.getElementById('history');
        const span = document.createElement('span');
        span.textContent = val;
        span.className = cls || '';
        el.appendChild(span);
    }

    function backToSetup() {
        document.getElementById('gameArea').classList.remove('active');
        document.getElementById('setupArea').style.display = 'flex';
    }

    document.getElementById('startBtn').addEventListener('click', startGame);
    document.getElementById('guessBtn').addEventListener('click', guess);
    document.getElementById('guessInput').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') guess();
    });
    document.getElementById('newGameBtn').addEventListener('click', backToSetup);

    document.getElementById('minInput').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') startGame();
    });
    document.getElementById('maxInput').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') startGame();
    });

    document.getElementById('guessInput').disabled = true;
    document.getElementById('guessBtn').disabled = true;
</script>
</body>
</html>
